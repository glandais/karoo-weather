name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Parse version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KAROO_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KAROO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KAROO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KAROO_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<PROPS
          storeFile=$(pwd)/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Build signed release APK
        env:
          KAROO_VERSION_NAME: ${{ steps.version.outputs.name }}
          KAROO_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew assembleRelease

      - name: Clean up keystore
        if: always()
        run: rm -f release.keystore keystore.properties

      # manifest.json is what the Karoo extension store polls; it must sit next to the APK
      # under releases/latest/download.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/manifest.json
          generate_release_notes: true
